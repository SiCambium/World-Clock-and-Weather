[package]
name = "timeatlas"
version = "2.0.0"
edition = "2024"
description = "World clock, weather and map for macOS"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "image", "advanced"] }
tokio = { version = "1", features = ["time", "fs", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
